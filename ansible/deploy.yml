---
- hosts: localhost
  connection: local
  vars:
    ecr_registry: "637423644082.dkr.ecr.ap-south-1.amazonaws.com"
    image_name: "devops-demo-app"
  tasks:
    - name: Pull latest Docker image from ECR
      docker_image:
        name: "{{ ecr_registry }}/{{ image_name }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Stop existing container if running
      docker_container:
        name: devops-app-container
        state: absent

    - name: Run new container
      docker_container:
        name: devops-app-container
        image: "{{ ecr_registry }}/{{ image_name }}:{{ image_tag }}"
        state: started
        published_ports:
          - "80:5000"
        restart_policy: always
